[package]
name = "yazelix_screen"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Anima: standalone terminal animations from Yazelix"
license = "Apache-2.0"
repository = "https://github.com/Yazelix/anima"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "Cargo.lock", "README.md", "LICENSE"]
keywords = ["animation", "terminal", "tui", "yazelix"]
categories = ["command-line-utilities"]

[[bin]]
name = "anima"
path = "src/bin/anima.rs"

[dependencies]
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
# The default Mio backend loops indefinitely on a closed PTY (Crossterm 0.29).
crossterm = { version = "0.29", features = ["use-dev-tty"] }
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
